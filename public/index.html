<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c12">
<title>Daily Checklist</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checklist">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101320'/%3E%3Cpath d='M18 33l10 10 20-22' fill='none' stroke='%238b7bff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0c12;
    --panel: #11141d;
    --panel-2: #161a26;
    --line: #232838;
    --line-2: #2f3550;
    --text: #e8eaf3;
    --muted: #8a90a8;
    --faint: #5b617a;
    --a1: #8b7bff;
    --a2: #38d6ff;
    --ok: #3ddc97;
    --danger: #ff6b81;
    --grad: linear-gradient(135deg, var(--a1), var(--a2));
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(139,123,255,.18), transparent 60%),
      radial-gradient(700px 500px at -10% 10%, rgba(56,214,255,.12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 740px; margin: 0 auto; padding: 36px 16px 0; }

  /* ---------- layout: projects | checklist | assets ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 740px); grid-template-areas: "main" "proj" "assets"; justify-content: center; gap: 26px; padding: 0 0 20px; }
  .layout > .wrap { grid-area: main; width: 100%; padding-bottom: 0; }
  #projectsSide { grid-area: proj; }
  #assetsSide { grid-area: assets; }
  .side { padding: 0 16px; min-width: 0; }
  @media (min-width: 1200px) {
    .layout { grid-template-columns: minmax(240px, 360px) minmax(0, 740px) minmax(240px, 360px); grid-template-areas: "proj main assets"; gap: 16px; padding: 0 16px 20px; }
    .side { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding: 36px 2px 24px; scrollbar-width: thin; }
  }
  .side-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 12px; }
  .side-head h2 { flex: 1; margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .side-head h2 em { font-style: normal; color: var(--faint); letter-spacing: 0; margin-left: 6px; }
  .side-list { display: grid; gap: 8px; }
  .side-list .editor { margin-bottom: 4px; }
  .side .empty { padding: 22px 14px; font-size: 13.5px; }
  .side .empty big { font-size: 26px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  .hello { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 4px 0 10px; font-size: clamp(26px, 5vw, 34px); line-height: 1.15; letter-spacing: -.02em; }
  h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ring { position: relative; width: 84px; height: 84px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: url(#g); stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 17px; }
  .ring b small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: -6px; text-align: center; }

  /* ---------- editor ---------- */
  .editor {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px 12px;
    transition: border-color .2s, box-shadow .2s;
    position: relative;
  }
  .editor:focus-within, .editor.drag { border-color: var(--a1); box-shadow: 0 0 0 4px rgba(139,123,255,.14), 0 10px 40px -12px rgba(139,123,255,.35); }
  .editor.shake { animation: shake .3s; border-color: var(--danger); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .editor input, .editor textarea {
    width: 100%; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; resize: none;
  }
  .editor .f-title { font-size: 20px; font-weight: 700; padding: 4px 0 6px; color: #fff; letter-spacing: -.01em; }
  .editor .f-desc { color: var(--muted); font-size: 14px; padding: 2px 0 6px; min-height: 44px; max-height: 260px; }
  .editor input::placeholder, .editor textarea::placeholder { color: var(--faint); }
  .editor .bar { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .editor .hint { color: var(--faint); font-size: 12.5px; flex: 1; min-width: 160px; }
  kbd { background: var(--line); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font: 11.5px ui-monospace, monospace; color: var(--muted); }
  .drop-msg { position: absolute; inset: 0; border-radius: inherit; display: none; place-items: center; background: rgba(10,12,18,.8); color: var(--a2); font-weight: 600; pointer-events: none; }
  .editor.drag .drop-msg { display: grid; }

  button { font: inherit; cursor: pointer; }
  .btn {
    border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text);
    border-radius: 10px; padding: 7px 13px; transition: .15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--a1); background: #1c2133; }
  .btn.primary { border: 0; background: var(--grad); color: #07090f; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--panel-2); border-color: var(--line); }
  .btn svg { width: 16px; height: 16px; }


  /* ---------- calendar ---------- */
  .cal { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 16px; }
  .cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .cal-head .label { flex: 1; font-weight: 700; letter-spacing: .01em; padding-left: 4px; }
  .navbtn { border: 1px solid var(--line); background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; line-height: 1; }
  .navbtn:hover { color: var(--text); background: var(--line); }
  .btn.sm { padding: 5px 11px; font-size: 13.5px; border-radius: 9px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    position: relative; border: 1px solid transparent; background: rgba(255,255,255,.025); color: var(--text); border-radius: 12px;
    padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 1px; transition: .15s; min-width: 0;
  }
  .day:hover { background: var(--line); }
  .day small { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .day b { font-size: 19px; line-height: 1.2; }
  .day .bar { width: 70%; max-width: 38px; height: 4px; border-radius: 4px; background: var(--line-2); margin-top: 5px; overflow: hidden; }
  .day .bar i { display: block; height: 100%; background: var(--grad); }
  .day .bar.full i { background: var(--ok); }
  .day .bar.none { background: transparent; }
  .day.today b { color: var(--a2); }
  .day.sel { background: linear-gradient(135deg, rgba(139,123,255,.28), rgba(56,214,255,.18)); border-color: var(--a1); box-shadow: 0 6px 24px -10px rgba(139,123,255,.7); }
  .day.past:not(.sel) { opacity: .6; }
  .month { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .month .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .month .dow { text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding-bottom: 4px; }
  .mday { position: relative; height: 40px; border: 1px solid transparent; background: transparent; color: var(--text); border-radius: 10px; font-size: 14px; }
  .mday:hover { background: var(--line); }
  .mday.other { color: var(--faint); }
  .mday.today { color: var(--a2); font-weight: 700; }
  .mday.sel { background: linear-gradient(135deg, rgba(139,123,255,.3), rgba(56,214,255,.2)); border-color: var(--a1); }
  .mday .dot { position: absolute; left: 50%; bottom: 4px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--a1); }
  .mday .dot.full { background: var(--ok); }


  /* ---------- editor fields ---------- */
  .lbl { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--a1); margin: 2px 0 0; }
  .lbl.d { color: var(--faint); margin-top: 8px; }
  .opts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .opts input[type=date] { width: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 10px; color: var(--text); font: inherit; font-size: 14px; color-scheme: dark; }
  .opts input[type=date]:focus { border-color: var(--a1); }
  .rep { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 14px; cursor: pointer; user-select: none; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); }
  .rep:has(input:checked) { color: var(--a2); border-color: var(--a2); }
  .rep input { width: auto; accent-color: var(--a2); margin: 0; }
  .editor .bar2 { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  /* ---------- thumbnails ---------- */
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumbs:not(:empty) { margin: 6px 0 8px; }
  .thumb { position: relative; width: 92px; height: 92px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-2); background: #000; cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .thumb:hover img { transform: scale(1.06); }
  .thumb .x {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.7); color: #fff; font-size: 14px; line-height: 1; display: grid; place-items: center; opacity: 0; transition: .15s;
  }
  .thumb:hover .x { opacity: 1; }
  .thumb .x:hover { background: var(--danger); }
  @media (hover: none) { .thumb .x { opacity: 1; } }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin: 26px 2px 12px; gap: 10px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); padding: 4px; border-radius: 12px; }
  .tabs button { background: transparent; border: 0; color: var(--muted); padding: 5px 14px; border-radius: 8px; transition: .15s; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { background: var(--line-2); color: var(--text); }
  .tabs button em { font-style: normal; color: var(--faint); margin-left: 4px; font-size: 12px; }

  /* ---------- list ---------- */
  #list { display: grid; gap: 10px; }
  .task {
    display: grid; grid-template-columns: auto auto auto 1fr auto; gap: 8px; align-items: start;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 12px 14px 6px;
    transition: border-color .2s, opacity .3s, transform .2s, box-shadow .2s;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .task:hover { border-color: var(--line-2); box-shadow: 0 8px 30px -14px rgba(0,0,0,.8); }
  .task.dragging { opacity: .35; }
  .task.over-top { box-shadow: 0 -3px 0 0 var(--a1); }
  .task.over-bottom { box-shadow: 0 3px 0 0 var(--a1); }
  .grip { color: var(--faint); padding: 3px 2px; cursor: grab; border-radius: 6px; user-select: none; opacity: .35; transition: .15s; margin-top: 2px; letter-spacing: -2px; }
  .task:hover .grip { opacity: 1; }
  .num { min-width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: var(--a1); background: rgba(139,123,255,.12); border: 1px solid rgba(139,123,255,.25); font-variant-numeric: tabular-nums; }
  .task.done .num { color: var(--faint); background: transparent; border-color: var(--line); }
  .grip:hover { color: var(--text); }
  @media (hover: none) { .grip { display: none; } .task { grid-template-columns: auto auto 1fr auto; padding-left: 12px; } }
  .check {
    width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--line-2); background: transparent; padding: 0; margin-top: 1px;
    display: grid; place-items: center; transition: .2s; color: #07090f;
  }
  .check:hover { border-color: var(--a1); box-shadow: 0 0 0 4px rgba(139,123,255,.15); }
  .check svg { width: 16px; height: 16px; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .05s; }
  .task.done .check { background: var(--grad); border-color: transparent; }
  .task.done .check svg { stroke-dashoffset: 0; }
  .body { min-width: 0; }
  .t-title { font-weight: 700; font-size: 19px; line-height: 1.3; color: #fff; letter-spacing: -.01em; overflow-wrap: anywhere; cursor: pointer; transition: color .2s; padding-top: 1px; }
  .badge { display: inline-block; vertical-align: middle; margin-left: 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--a2); border: 1px solid rgba(56,214,255,.4); border-radius: 20px; padding: 0 8px; }
  .badge.carry { color: #ffd98a; border-color: rgba(255,200,87,.4); }
  .t-desc { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; font-size: 13.5px; line-height: 1.55; border-left: 2px solid var(--line-2); padding-left: 10px; }
  .task.done .t-title { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--faint); }
  .task.done .t-desc, .task.done .thumbs { opacity: .45; }
  .t-desc a { color: var(--a2); }
  .actions { display: flex; gap: 2px; opacity: 0; transition: .15s; }
  .task:hover .actions, .task:focus-within .actions { opacity: 1; }
  @media (hover: none) { .actions { opacity: 1; } }
  .icon { border: 0; background: transparent; color: var(--muted); border-radius: 8px; width: 32px; height: 32px; display: grid; place-items: center; }
  .icon:hover { background: var(--line); color: var(--text); }
  .icon:disabled { opacity: .2; pointer-events: none; }
  .icon.del:hover { color: var(--danger); }
  .icon svg { width: 17px; height: 17px; }
  .task.editing { display: block; padding: 0; border: 0; background: none; box-shadow: none; }
  .task.asset { grid-template-columns: auto 1fr; position: relative; padding: 11px 12px 11px 4px; gap: 4px; }
  .task.asset .t-title { cursor: default; font-size: 16px; }
  .task.asset .t-desc { font-size: 13px; }
  .task.asset .thumb { width: 64px; height: 64px; }
  .task.asset .actions { position: absolute; top: 6px; right: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
  .task.asset .icon { width: 28px; height: 28px; }
  .task.asset .icon svg { width: 15px; height: 15px; }
  @media (hover: none) {
    .task.asset { grid-template-columns: 1fr auto; padding-left: 12px; }
    .task.asset .actions { position: static; background: none; border: 0; }
  }

  .empty { text-align: center; color: var(--muted); padding: 50px 20px; border: 1px dashed var(--line-2); border-radius: var(--radius); }
  .empty big { display: block; font-size: 38px; margin-bottom: 6px; }
  .empty.win { border-color: rgba(61,220,151,.4); color: var(--ok); }

  footer { margin: 10px 0 0; padding: 0 16px 80px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

  /* ---------- sync ---------- */
  .sync-status { color: var(--faint); font-size: 13px; align-self: center; }
  .sync-status.err { color: #ffd98a; }
  /* ---------- reminders ---------- */
  .rem-btn.on { color: #ffd98a; border-color: rgba(255,200,87,.5); background: rgba(255,200,87,.07); }
  .rem-box:not(:empty) { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 12px; background: rgba(255,200,87,.035); }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip-lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-right: 2px; }
  .chip-lbl:not(:first-child) { margin-left: 6px; }
  .chip { border: 1px solid var(--line-2); background: var(--panel); color: var(--text); border-radius: 20px; padding: 4px 11px; font-size: 13px; transition: .15s; }
  .chip:hover { border-color: #ffd98a; color: #ffd98a; }
  .rem-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .editor .rem-row input, .rem-row select { width: auto; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 10px; color: var(--text); font: inherit; font-size: 14px; color-scheme: dark; }
  .rem-note { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .rem-note.warn { color: #ffd98a; }
  .badge.rem { color: #ffd98a; border-color: rgba(255,200,87,.45); cursor: pointer; }
  .badge.rem.soon { background: rgba(255,200,87,.12); }
  .badge.rem.late { color: var(--danger); border-color: rgba(255,107,129,.45); }
  .task.done .badge.rem { opacity: .5; }
  .task.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 30% { border-color: #ffd98a; box-shadow: 0 0 0 4px rgba(255,200,87,.25); } }
  #alerts { position: fixed; right: 16px; bottom: 16px; z-index: 55; display: grid; gap: 10px; width: min(360px, calc(100% - 32px)); }
  @media (max-width: 520px) { #alerts { top: 12px; bottom: auto; left: 16px; right: 16px; width: auto; } }
  .alert { position: relative; background: #1b2033; border: 1px solid rgba(255,200,87,.45); border-radius: 14px; padding: 12px 14px; box-shadow: 0 18px 50px rgba(0,0,0,.65); animation: pop .25s ease-out; }
  .alert .al-head { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #ffd98a; padding-right: 26px; }
  .alert.missed .al-head { color: var(--muted); }
  .alert .al-title { font-weight: 700; font-size: 16.5px; margin: 3px 0 2px; overflow-wrap: anywhere; }
  .alert .al-desc { color: var(--muted); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 3.2em; overflow: hidden; }
  .alert .al-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .alert .close { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; }
  #remBtn em { margin-left: 2px; font-style: normal; background: rgba(255,200,87,.15); color: #ffd98a; border-radius: 10px; padding: 0 7px; font-size: 12px; }
  .dlg h4 { margin: 18px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .dlg .state { border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; background: var(--panel-2); }
  .dlg .state p { margin: 0 0 4px; }
  .dlg .state.ok { border-color: rgba(61,220,151,.4); }
  .dlg .state.ok b { color: var(--ok); }
  .up-list { display: grid; gap: 4px; max-height: 42vh; overflow-y: auto; }
  .up-item { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: baseline; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; color: var(--text); padding: 7px 8px; }
  .up-item:hover { background: var(--panel-2); border-color: var(--line); }
  .up-item small { color: #ffd98a; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .up-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up-item i { font-style: normal; color: var(--faint); font-size: 12px; margin-left: 6px; }

  dialog.dlg { width: min(460px, calc(100% - 32px)); background: var(--panel); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
  dialog.dlg::backdrop { background: rgba(5,6,10,.75); backdrop-filter: blur(4px); }
  dialog.dlg h3 { margin: 0 0 8px; font-size: 20px; }
  dialog.dlg p { color: var(--muted); margin: 8px 0; font-size: 14px; }
  dialog.dlg .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  dialog.dlg input { flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 10px; color: var(--text); font: 13px ui-monospace, monospace; }
  #syncDlg .qr { display: grid; place-items: center; margin: 12px 0; }
  #syncDlg .qr img { background: #fff; padding: 10px; border-radius: 12px; width: 190px; height: 190px; image-rendering: pixelated; }
  dialog.dlg .warn { font-size: 12.5px; color: var(--faint); }
  dialog.dlg .close { position: absolute; top: 10px; right: 10px; }

  /* ---------- lightbox & toast ---------- */
  #lightbox { position: fixed; inset: 0; background: rgba(5,6,10,.92); display: none; place-items: center; z-index: 50; cursor: zoom-out; padding: 20px; backdrop-filter: blur(6px); }
  #lightbox.on { display: grid; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
  #toast {
    position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: 24px; transform: translateY(30px); opacity: 0; pointer-events: none; z-index: 60;
    background: #1b2033; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center;
    transition: .25s; box-shadow: 0 14px 40px rgba(0,0,0,.6); max-width: calc(100% - 32px);
  }
  #toast.on { opacity: 1; transform: translateY(0); pointer-events: auto; }
  #toast button { white-space: nowrap; }
  #toast button { background: none; border: 0; color: var(--a2); font-weight: 700; padding: 0; }

  @media (max-width: 520px) {
    .day b { font-size: 16px; }
    .day small { font-size: 10px; letter-spacing: .03em; }
    .week { gap: 3px; }
    .ring { width: 70px; height: 70px; }
    .ring svg { width: 70px; height: 70px; }
    .thumb { width: 78px; height: 78px; }
    /* give the title the full width; edit/move/delete buttons go on their own row */
    .task { grid-template-columns: auto auto auto 1fr; }
    .task .actions { grid-column: 2 / -1; justify-content: flex-end; margin: -6px 0 -8px; }
  }
  @media (max-width: 520px) and (hover: none) { .task { grid-template-columns: auto auto 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="layout">
<aside class="side" id="projectsSide" aria-label="Ongoing projects"></aside>

<main class="wrap">
  <header>
    <div>
      <div class="hello" id="date"></div>
      <h1 id="greet"></h1>
    </div>
    <div class="ring" id="ring">
      <svg width="84" height="84" viewBox="0 0 64 64">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#38d6ff"/></linearGradient></defs>
        <circle class="bg" cx="32" cy="32" r="27"/>
        <circle class="fg" cx="32" cy="32" r="27" stroke-dasharray="169.65" stroke-dashoffset="169.65"/>
      </svg>
      <b><span id="ringText">0/0</span></b>
    </div>
  </header>

  <section class="cal" id="cal"></section>

  <div id="composer"></div>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="btn ghost" id="remBtn" title="Reminders & notifications">🔔 Reminders</button>
      <button class="btn ghost" id="uncheck" title="Uncheck everything on this day">Reset day</button>
    </div>
  </div>

  <div id="list"></div>
</main>

<aside class="side" id="assetsSide" aria-label="Assets"></aside>
</div>

<footer>
  <button class="btn ghost" id="syncBtn">☁ Sync devices</button>
  <span class="sync-status" id="syncStatus"></span>
  <button class="btn ghost" id="export">Export backup</button>
  <button class="btn ghost" id="import">Import backup</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</footer>

<dialog id="syncDlg" class="dlg"></dialog>
<dialog id="remDlg" class="dlg"></dialog>
<div id="alerts" aria-live="polite"></div>
<div id="lightbox"><img alt=""></div>
<div id="toast"><span></span><button hidden>Undo</button></div>

<script>
(() => {
  'use strict';

  /* ================= helpers ================= */
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;      // only used with static icon strings
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid);
    return e;
  };
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const pad = n => String(n).padStart(2, '0');
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dayKey(d); };
  const fmt = (k, o) => parseKey(k).toLocaleDateString(undefined, o);
  const niceDay = k => {
    const t = dayKey();
    if (k === t) return 'Today';
    if (k === addDays(t, 1)) return 'Tomorrow';
    if (k === addDays(t, -1)) return 'Yesterday';
    return fmt(k, { weekday: 'long' });
  };

  const ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>',
  };
  const escapeHTML = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  /* ================= storage ================= */
  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('daily-checklist', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(key = 'state') {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction('kv').objectStore('kv').get(key);
        q.onsuccess = () => res(q.result);
        q.onerror = () => rej(q.error);
      });
    },
    async set(v, key = 'state') {
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction('kv', 'readwrite');
        t.objectStore('kv').put(v, key);
        t.oncomplete = res;
        t.onerror = () => rej(t.error);
      });
    },
  };

  // task  = { id, title, desc, images[], date: 'YYYY-MM-DD', repeat: 'daily' | '', u: last change (ms) }
  // done  = { 'YYYY-MM-DD': { taskId: +time checked | -time unchecked } }   (old data: true)
  // asset = { id, title, desc, images[], kind: 'project' | 'asset', u }
  // del   = { id: time deleted },  ou = { tasks: time reordered, assets: … }   — used to merge devices
  let state = { tasks: [], done: {}, assets: [], del: {}, ou: {} };

  // older versions had no dates: those tasks were daily, so keep them repeating
  function normalize(data) {
    const first = Object.keys(data.done || {}).sort()[0] || dayKey();
    const tasks = data.tasks.map(t => t.date ? t : { ...t, date: first, repeat: 'daily' });
    return { tasks, done: data.done || {}, assets: Array.isArray(data.assets) ? data.assets : [], del: data.del || {}, ou: data.ou || {}, savedAt: data.savedAt || 0 };
  }
  // everything is kept in two places in the browser (IndexedDB + localStorage); the newest copy wins
  async function load() {
    let a, b;
    try { a = await idb.get(); } catch {}
    try { b = JSON.parse(localStorage.getItem('daily-checklist') || 'null'); } catch {}
    const data = [a, b].filter(x => x && Array.isArray(x.tasks)).sort((x, y) => (y.savedAt || 0) - (x.savedAt || 0))[0];
    if (data) state = normalize(data);
    navigator.storage?.persist?.().catch(() => {});   // ask the browser never to clear it on its own
  }
  // saves right away on every change (no delay), so closing the tab can't lose anything
  function save() {
    persist();
    scheduleSync();
  }
  function persist() {
    finCache = null;
    state.savedAt = Date.now();
    let mirrored = false;
    try { localStorage.setItem('daily-checklist', JSON.stringify(state)); mirrored = true; } catch {}
    idb.set(state).catch(() => { if (!mirrored) toast('⚠️ Could not save — storage is full or blocked'); });
  }

  /* ================= images ================= */
  async function toDataURL(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/webp', 0.86);
    } finally { URL.revokeObjectURL(url); }
  }
  const openImage = src => { const lb = $('#lightbox'); $('img', lb).src = src; lb.classList.add('on'); };

  function thumbs(images, onRemove) {
    return h('div', { class: 'thumbs' }, images.map((src, i) => src.startsWith('img:') ? null :
      h('div', { class: 'thumb', onclick: () => openImage(src) },
        h('img', { src, alt: 'attachment' }),
        onRemove && h('button', { class: 'x', type: 'button', title: 'Remove image', onclick: e => { e.stopPropagation(); onRemove(i); } }, '×'))));
  }

  /* ================= editor (used for "new" and "edit") ================= */
  function createEditor({ task, date, onSave, onCancel, autofocus, asset, kind, draftKey, openRem }) {
    let images = [...(task?.images || [])];
    let rem = task?.rem?.time ? { date: task.rem.date, time: task.rem.time, repeat: task.rem.repeat || '' } : null;
    const title = h('input', { class: 'f-title', type: 'text', placeholder: asset ? 'Asset or project name' : 'What needs to be done?', maxlength: 200, 'aria-label': 'Title' });
    const desc = h('textarea', { class: 'f-desc', placeholder: asset ? 'Details, status, links… (optional)' : 'Notes, details, links… (optional)', rows: 2, 'aria-label': 'Description' });
    const kindName = 'kind-' + uid();
    const kinds = [['project', 'Ongoing project'], ['asset', 'Asset']].map(([v, label]) => {
      const r = h('input', { type: 'radio', name: kindName, value: v });
      r.checked = (task?.kind || 'project') === v;
      return h('label', { class: 'rep' }, r, h('span', { text: label }));
    });
    const kindVal = () => task ? kinds.find(l => $('input', l).checked).querySelector('input').value : kind;
    const dateIn = h('input', { type: 'date', 'aria-label': 'Date' });
    const repeat = h('input', { type: 'checkbox' });
    title.value = task?.title || '';
    desc.value = task?.desc || '';
    dateIn.value = task?.date || date || dayKey();
    repeat.checked = task?.repeat === 'daily';
    const strip = h('div');
    const fileInput = h('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true });

    const grow = () => { desc.style.height = 'auto'; desc.style.height = Math.min(desc.scrollHeight, 260) + 'px'; };
    desc.addEventListener('input', grow);

    const drawStrip = () => { strip.replaceChildren(thumbs(images, i => { images.splice(i, 1); drawStrip(); })); };
    const addFiles = async files => {
      for (const f of files) {
        try { images.push(await toDataURL(f)); } catch { toast('Could not read that image'); }
      }
      drawStrip();
    };
    fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });

    // ---- reminder / timer ----
    const remBtn = h('button', { class: 'btn rem-btn', type: 'button', onclick: () => { remOpen = !remOpen || !rem; if (remOpen && !rem) rem = defaultRem(); drawRem(); } });
    const remBox = h('div', { class: 'rem-box' });
    let remOpen = !!openRem;
    const defaultRem = () => {
      const now = new Date(), k = asset ? dayKey() : (dateIn.value || dayKey());
      const nextHour = `${pad((now.getHours() + 1) % 24)}:00`;
      return { date: k < dayKey() ? dayKey() : k, time: k === dayKey() ? nextHour : '09:00', repeat: !asset && repeat.checked ? 'daily' : '' };
    };
    const setIn = minutes => { const d = new Date(Date.now() + minutes * 60_000); rem = { date: dayKey(d), time: `${pad(d.getHours())}:${pad(d.getMinutes())}`, repeat: '' }; drawRem(); };
    const setAt = (dayOffset, time) => { rem = { date: addDays(dayKey(), dayOffset), time, repeat: '' }; drawRem(); };
    const drawRem = () => {
      remBtn.classList.toggle('on', !!rem);
      remBtn.innerHTML = ICON.bell + `<span>${rem ? escapeHTML(describeRem(rem)) : 'Reminder'}</span>`;
      remBox.replaceChildren();
      if (!remOpen) return;
      if (!rem) rem = defaultRem();
      const remDate = h('input', { type: 'date', 'aria-label': 'Reminder date', value: rem.date, onchange: e => { rem.date = e.target.value || dayKey(); drawRem(); } });
      const remTime = h('input', { type: 'time', 'aria-label': 'Reminder time', value: rem.time, onchange: e => { rem.time = e.target.value || '09:00'; drawRem(); } });
      const remRep = h('select', { 'aria-label': 'Repeat reminder', onchange: e => { rem.repeat = e.target.value; drawRem(); } },
        Object.entries(REPEAT_LABEL).map(([v, label]) => { const o = h('option', { value: v, text: label }); o.selected = rem.repeat === v; return o; }));
      const evening = new Date().getHours() < 19;
      remBox.append(
        h('div', { class: 'chips' },
          h('span', { class: 'chip-lbl', text: 'Timer' }),
          [[10, '10 min'], [30, '30 min'], [60, '1 hour'], [120, '2 hours']].map(([m, label]) => h('button', { class: 'chip', type: 'button', text: label, onclick: () => setIn(m) })),
          h('span', { class: 'chip-lbl', text: 'At' }),
          h('button', { class: 'chip', type: 'button', text: evening ? 'Tonight 19:00' : 'Tomorrow 19:00', onclick: () => setAt(evening ? 0 : 1, '19:00') }),
          h('button', { class: 'chip', type: 'button', text: 'Tomorrow 9:00', onclick: () => setAt(1, '09:00') })),
        h('div', { class: 'rem-row' }, remDate, remTime, remRep,
          h('button', { class: 'btn ghost sm', type: 'button', text: 'Remove', onclick: () => { rem = null; remOpen = false; drawRem(); } })),
        h('div', { class: 'rem-note' + (!rem.repeat && atTime(rem.date, rem.time) <= Date.now() ? ' warn' : ''), text: remNote(rem) }));
    };

    const submit = () => {
      const t = title.value.trim();
      if (!t) {
        root.classList.remove('shake'); void root.offsetWidth; root.classList.add('shake');
        title.focus(); return;
      }
      const r = rem && rem.time && rem.date ? { ...rem } : null;
      onSave(asset
        ? { title: t, desc: desc.value.trim(), images: [...images], kind: kindVal(), rem: r }
        : { title: t, desc: desc.value.trim(), images: [...images], date: dateIn.value || dayKey(), repeat: repeat.checked ? 'daily' : '', rem: r });
      if (r) nudgeNotifications();
      if (!task) { title.value = ''; desc.value = ''; images = []; repeat.checked = false; rem = null; remOpen = false; drawRem(); grow(); drawStrip(); title.focus(); saveDraft(); }
    };

    // unsent text survives a closed tab too
    const saveDraft = () => {
      if (!draftKey) return;
      try { title.value || desc.value ? localStorage.setItem(draftKey, JSON.stringify([title.value, desc.value])) : localStorage.removeItem(draftKey); } catch {}
    };
    if (draftKey) {
      try { const d = JSON.parse(localStorage.getItem(draftKey) || 'null'); if (d) { title.value = d[0] || ''; desc.value = d[1] || ''; } } catch {}
      title.addEventListener('input', saveDraft); desc.addEventListener('input', saveDraft);
    }

    title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    desc.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } });
    const esc = e => { if (e.key === 'Escape' && onCancel) onCancel(); };
    title.addEventListener('keydown', esc); desc.addEventListener('keydown', esc);

    const root = h('form', { class: 'editor', onsubmit: e => { e.preventDefault(); submit(); } },
      h('label', { class: 'lbl', text: asset ? 'Name' : 'Title' }), title,
      h('label', { class: 'lbl d', text: asset ? 'Notes' : 'Description' }), desc,
      strip,
      h('div', { class: 'opts' },
        h('button', { class: 'btn', type: 'button', html: ICON.image + '<span>Image</span>', onclick: () => fileInput.click() }),
        remBtn,
        asset ? (task ? kinds : null) : [dateIn,
          h('label', { class: 'rep', title: 'Show this task every day from the chosen date' }, repeat, h('span', { text: 'Repeat daily' }))]),
      remBox,
      h('div', { class: 'bar2' },
        h('span', { class: 'hint', html: '<kbd>Ctrl</kbd>+<kbd>V</kbd> pastes an image · drag &amp; drop works too' }),
        onCancel && h('button', { class: 'btn ghost', type: 'button', text: 'Cancel', onclick: onCancel }),
        h('button', { class: 'btn primary', type: 'submit', html: (task ? ICON.check : ICON.plus) + `<span>${task ? 'Save' : asset ? 'Add' : 'Add task'}</span>` })),
      fileInput,
      h('div', { class: 'drop-msg', text: 'Drop image to attach' }));

    // drag & drop
    let depth = 0;
    root.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { depth++; root.classList.add('drag'); } });
    root.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; root.classList.remove('drag'); } });
    root.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
    root.addEventListener('drop', e => {
      depth = 0; root.classList.remove('drag');
      const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
      if (files.length) { e.preventDefault(); addFiles(files); }
    });

    root._addFiles = addFiles;
    root._focus = () => title.focus();
    root._setDate = k => { dateIn.value = k; };
    drawStrip(); drawRem(); requestAnimationFrame(grow);
    if (autofocus) setTimeout(() => title.focus(), 0);
    return root;
  }

  /* ================= app state & logic ================= */
  let filter = 'all';
  let editingId = null;
  let today = dayKey();
  let sel = today;                       // the day being viewed
  let monthOpen = false;
  let viewMonth = sel.slice(0, 7);       // 'YYYY-MM' shown in the month grid
  let mainEditor;
  let editRem = false;                   // open the reminder part when the editor opens
  let adding = null;                     // 'project' | 'asset' while its add form is open
  const sideEditors = {};                // kept alive so re-renders don't wipe what you're typing

  const doneFor = k => (state.done[k] ||= {});
  const isDone = (k, id) => state.done[k]?.[id] > 0;
  // the day a one-off task was checked off (undefined while it is still open)
  let finCache = null;
  const finishedOn = t => {
    if (!finCache) {
      finCache = {};
      for (const k of Object.keys(state.done).sort()) for (const id in state.done[k]) if (state.done[k][id] > 0) (finCache[id] ||= []).push(k);
    }
    return (finCache[t.id] || []).find(k => k >= t.date);
  };
  // one-off tasks stay on every day after their date (up to today) until they are checked off
  const tasksFor = k => state.tasks.filter(t => {
    if (t.repeat === 'daily') return k >= t.date;
    if (t.date === k) return true;
    if (t.date > k || k > today) return false;
    const fin = finishedOn(t);
    return !fin || fin >= k;
  });
  const stats = k => { const l = tasksFor(k); return { total: l.length, done: l.filter(t => isDone(k, t.id)).length }; };

  function setSel(k) {
    sel = k; viewMonth = k.slice(0, 7); editingId = null;
    mainEditor?._setDate(k);
    render();
  }
  function addTask(data) {
    const id = uid();
    state.tasks.push({ id, ...data, u: Date.now() });
    save();
    if (!tasksFor(sel).some(t => t.id === id)) toast(`Added to ${niceDay(data.date)}, ${fmt(data.date, { month: 'short', day: 'numeric' })}`);
    render();
  }
  function toggle(id) {
    if (isDone(sel, id)) { doneFor(sel)[id] = -Date.now(); save(); render(); }
    else markDone(id, sel);
  }
  function markDone(id, day) {
    const t = state.tasks.find(x => x.id === id), now = Date.now();
    if (!t) return;
    // a one-off task is finished on exactly one day
    if (t.repeat !== 'daily') for (const k in state.done) if (state.done[k][id] > 0) state.done[k][id] = -now;
    doneFor(day)[id] = now;
    dropAlerts(id);
    save(); render();
  }
  function remove(id) {
    const idx = state.tasks.findIndex(t => t.id === id);
    const [task] = state.tasks.splice(idx, 1);
    state.del[id] = Date.now();
    save(); render();
    toast(task.repeat ? 'Daily task deleted from all days' : 'Task deleted', () => { delete state.del[id]; task.u = Date.now(); state.tasks.splice(idx, 0, task); save(); render(); });
  }
  function reorder(fromId, toId, after, arr = state.tasks) {
    const [m] = arr.splice(arr.findIndex(t => t.id === fromId), 1);
    const to = arr.findIndex(t => t.id === toId);
    arr.splice(after ? to + 1 : to, 0, m);
    state.ou[arr === state.assets ? 'assets' : 'tasks'] = Date.now();
    save(); render();
  }
  function nudge(id, dir) {
    const list = tasksFor(sel), i = list.findIndex(t => t.id === id), j = i + dir;
    if (j < 0 || j >= list.length) return;
    reorder(id, list[j].id, dir > 0);
  }

  const assetsOf = kind => state.assets.filter(a => (a.kind || 'project') === kind);
  function addAsset(data) {
    state.assets.push({ id: uid(), ...data, u: Date.now() });
    save(); render();
  }
  function removeAsset(id) {
    const idx = state.assets.findIndex(a => a.id === id);
    const [a] = state.assets.splice(idx, 1);
    state.del[id] = Date.now();
    save(); render();
    toast(`"${a.title}" deleted`, () => { delete state.del[id]; a.u = Date.now(); state.assets.splice(idx, 0, a); save(); render(); });
  }
  function nudgeAsset(a, dir) {
    const list = assetsOf(a.kind || 'project'), j = list.findIndex(x => x.id === a.id) + dir;
    if (j < 0 || j >= list.length) return;
    reorder(a.id, list[j].id, dir > 0, state.assets);
  }

  const linkify = text => {
    const frag = document.createDocumentFragment();
    text.split(/(https?:\/\/[^\s<]+)/g).forEach((part, i) => {
      frag.append(i % 2 ? h('a', { href: part, target: '_blank', rel: 'noopener noreferrer', text: part }) : part);
    });
    return frag;
  };

  /* ================= rendering ================= */
  function taskCard(t, n, count) {
    if (editingId === t.id) {
      const ed = createEditor({
        task: t, autofocus: true, openRem: editRem,
        onCancel: () => { editingId = null; editRem = false; render(); },
        onSave: data => { Object.assign(state.tasks.find(x => x.id === t.id) || {}, data, { u: Date.now() }); editingId = null; editRem = false; save(); render(); },
      });

    }
    const done = isDone(sel, t.id);
    const card = h('div', { class: 'task' + (done ? ' done' : ''), 'data-id': t.id },
      h('span', { class: 'grip', title: 'Drag to reorder', text: '⋮⋮',
        onmousedown: () => { card.draggable = true; }, onmouseup: () => { card.draggable = false; } }),
      h('span', { class: 'num', text: n, title: `Task ${n}` }),
      h('button', { class: 'check', 'aria-label': done ? 'Mark as not done' : 'Mark as done', 'aria-pressed': String(done), html: ICON.check, onclick: () => toggle(t.id) }),
      h('div', { class: 'body' },
        h('div', { class: 't-title', onclick: () => toggle(t.id) }, t.title,
          t.repeat ? h('span', { class: 'badge', text: '↻ daily' })

          remBadge(t, true)),

      h('div', { class: 'actions' },
        h('button', { class: 'icon', title: 'Move up', 'aria-label': 'Move up', html: ICON.up, disabled: n === 1, onclick: () => nudge(t.id, -1) }),
        h('button', { class: 'icon', title: 'Move down', 'aria-label': 'Move down', html: ICON.down, disabled: n === count, onclick: () => nudge(t.id, 1) }),
        h('button', { class: 'icon', title: 'Reminder', 'aria-label': 'Set a reminder', html: ICON.bell, onclick: () => editReminder(t.id) }),
        h('button', { class: 'icon', title: 'Edit', 'aria-label': 'Edit', html: ICON.edit, onclick: () => { editingId = t.id; render(); } }),
        h('button', { class: 'icon del', title: 'Delete', 'aria-label': 'Delete', html: ICON.trash, onclick: () => remove(t.id) })));

  }

  // reorder via drag (the grip turns dragging on)
  function dragSort(card, id, type, onDrop) {
    card.addEventListener('dragstart', e => { card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData(type, id); });
    card.addEventListener('dragend', () => { card.draggable = false; card.classList.remove('dragging'); clearOver(); });
    card.addEventListener('dragover', e => {
      if (!e.dataTransfer.types.includes(type)) return;
      e.preventDefault(); clearOver();
      const r = card.getBoundingClientRect();
      card.classList.add(e.clientY < r.top + r.height / 2 ? 'over-top' : 'over-bottom');
    });
    card.addEventListener('drop', e => {
      const from = e.dataTransfer.getData(type);
      if (!from || from === id) return;
      e.preventDefault();
      const r = card.getBoundingClientRect();
      onDrop(from, e.clientY >= r.top + r.height / 2);
    });
    return card;
  }

  function assetCard(a, i, count) {

        task: a, asset: true, autofocus: true, openRem: editRem,
        onCancel: () => { editingId = null; editRem = false; render(); },

      h('div', { class: 'body' },
        h('div', { class: 't-title' }, a.title, remBadge(a, false)),
        a.desc && h('div', { class: 't-desc' }, linkify(a.desc)),

      h('div', { class: 'actions' },

        h('button', { class: 'icon', title: 'Reminder', 'aria-label': 'Set a reminder', html: ICON.bell, onclick: () => editReminder(a.id) }),
        h('button', { class: 'icon', title: 'Edit', 'aria-label': 'Edit', html: ICON.edit, onclick: () => { editingId = a.id; render(); } }),
        h('button', { class: 'icon del', title: 'Delete', 'aria-label': 'Delete', html: ICON.trash, onclick: () => removeAsset(a.id) })));

  function renderSide(box, kind, label, noun, emoji) {
    const items = assetsOf(kind);

  function renderAssets() {

  }
  const clearOver = () => document.querySelectorAll('.over-top,.over-bottom').forEach(n => n.classList.remove('over-top', 'over-bottom'));

  function renderCalendar() {
    const cal = $('#cal'); cal.replaceChildren();
    const dow = (parseKey(sel).getDay() + 6) % 7;          // Monday = 0
    const start = addDays(sel, -dow);
    const mFmt = { month: 'long', year: 'numeric' };

    cal.append(h('div', { class: 'cal-head' },
      h('button', { class: 'navbtn', 'aria-label': 'Previous week', text: '‹', onclick: () => setSel(addDays(sel, -7)) }),
      h('div', { class: 'label', text: `${fmt(start, { month: 'short', day: 'numeric' })} – ${fmt(addDays(start, 6), { month: 'short', day: 'numeric' })}` }),
      sel !== today && h('button', { class: 'btn sm', text: 'Today', onclick: () => setSel(today) }),
      h('button', { class: 'btn sm', text: monthOpen ? 'Hide month' : 'Month', onclick: () => { monthOpen = !monthOpen; render(); } }),
      h('button', { class: 'navbtn', 'aria-label': 'Next week', text: '›', onclick: () => setSel(addDays(sel, 7)) })));

    const week = h('div', { class: 'week' });
    for (let i = 0; i < 7; i++) {
      const k = addDays(start, i), st = stats(k);
      const pct = st.total ? Math.round(100 * st.done / st.total) : 0;
      week.append(h('button', {
        class: 'day' + (k === sel ? ' sel' : '') + (k === today ? ' today' : '') + (k < today ? ' past' : ''),
        title: `${fmt(k, { weekday: 'long', month: 'long', day: 'numeric' })} — ${st.done}/${st.total} done`,
        onclick: () => setSel(k),
      }, h('small', { text: fmt(k, { weekday: 'short' }) }), h('b', { text: parseKey(k).getDate() }),
         h('span', { class: 'bar' + (!st.total ? ' none' : st.done === st.total ? ' full' : '') }, h('i', { style: `width:${pct}%` }))));
    }
    cal.append(week);

    if (monthOpen) {
      const [vy, vm] = viewMonth.split('-').map(Number);
      const first = `${vy}-${pad(vm)}-01`;
      const gridStart = addDays(first, -((parseKey(first).getDay() + 6) % 7));
      const shiftMonth = n => { const d = new Date(vy, vm - 1 + n, 1); viewMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); };
      const grid = h('div', { class: 'grid' }, ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(n => h('div', { class: 'dow', text: n })));
      for (let i = 0; i < 42; i++) {
        const k = addDays(gridStart, i);
        if (i >= 35 && k.slice(0, 7) !== viewMonth) break;
        const st = stats(k);
        grid.append(h('button', {
          class: 'mday' + (k === sel ? ' sel' : '') + (k === today ? ' today' : '') + (k.slice(0, 7) !== viewMonth ? ' other' : ''),
          onclick: () => setSel(k),
        }, String(parseKey(k).getDate()), st.total ? h('span', { class: 'dot' + (st.done === st.total ? ' full' : '') }) : null));
      }
      cal.append(h('div', { class: 'month' },
        h('div', { class: 'cal-head' },
          h('button', { class: 'navbtn', 'aria-label': 'Previous month', text: '‹', onclick: () => shiftMonth(-1) }),
          h('div', { class: 'label', text: fmt(first, mFmt) }),
          h('button', { class: 'navbtn', 'aria-label': 'Next month', text: '›', onclick: () => shiftMonth(1) })),
        grid));
    }
  }

  function render() {
    renderChecklist();
    renderAssets();
    updateRemBtn();
  }

  function renderChecklist() {
    // header
    const hr = new Date().getHours();
    $('#date').textContent = `${niceDay(sel)} · ${fmt(sel, { month: 'long', day: 'numeric' })}`;
    $('#greet').replaceChildren(...(sel === today
      ? [hr < 5 ? 'Still up? ' : hr < 12 ? 'Good morning. ' : hr < 18 ? 'Good afternoon. ' : 'Good evening. ', h('span', { text: "Let's get it done." })]
      : sel > today ? ['Planning ahead. ', h('span', { text: 'Future you says thanks.' })]
      : ['Looking back. ', h('span', { text: 'Here is that day.' })]));

    const day = tasksFor(sel);
    const total = day.length;
    const nDone = day.filter(t => isDone(sel, t.id)).length;
    $('#ringText').textContent = `${nDone}/${total}`;
    $('.ring .fg').style.strokeDashoffset = 169.65 * (1 - (total ? nDone / total : 0));

    renderCalendar();

    // tabs
    const tabs = $('#tabs'); tabs.replaceChildren();
    [['all', 'All', total], ['open', 'To do', total - nDone], ['done', 'Done', nDone]].forEach(([k, label, n]) =>
      tabs.append(h('button', { class: filter === k ? 'on' : '', onclick: () => { filter = k; render(); } }, label, h('em', { text: n }))));

    // list (numbers = position in the day's full list, so they stay put when filtering)
    const list = $('#list'); list.replaceChildren();
    const rows = day.map((t, i) => [t, i + 1]).filter(([t]) => filter === 'all' || (filter === 'done') === isDone(sel, t.id) || editingId === t.id);
    if (!total) list.append(h('div', { class: 'empty' }, h('big', { text: sel < today ? '🕰️' : '✨' }), sel < today ? 'Nothing was planned for this day.' : 'Nothing planned for this day yet. Add a task above.'));
    else if (!rows.length) list.append(filter === 'open'
      ? h('div', { class: 'empty win' }, h('big', { text: '🎉' }), 'Everything done. Nice work!')
      : h('div', { class: 'empty' }, h('big', { text: '🌱' }), 'Nothing checked off yet.'));
    else rows.forEach(([t, n]) => list.append(taskCard(t, n, total)));
  }

  /* ================= reminders & notifications ================= */
  // item.rem = { date: 'YYYY-MM-DD', time: 'HH:MM', repeat: '' | 'daily' | 'weekdays' | 'weekly', snooze?: ms }
  // Reminders pop up inside the app while it's open (any device); with notifications turned on, the server
  // also pushes them to every subscribed phone/laptop while the app is closed (netlify/functions/reminders.mjs).
  const REPEAT_LABEL = { '': 'Once', daily: 'Every day', weekdays: 'Weekdays (Mon–Fri)', weekly: 'Every week' };
  const DAY = 864e5;
  const atTime = (k, time) => { const d = parseKey(k), [hh, mm] = time.split(':').map(Number); d.setHours(hh, mm, 0, 0); return d.getTime(); };
  const clock = t => new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const whenLabel = t => {
    const k = dayKey(new Date(t)), td = dayKey();
    if (k === td) return `Today ${clock(t)}`;
    if (k === addDays(td, 1)) return `Tomorrow ${clock(t)}`;
    if (k === addDays(td, -1)) return `Yesterday ${clock(t)}`;
    if (k > td && k <= addDays(td, 6)) return `${fmt(k, { weekday: 'short' })} ${clock(t)}`;
    return `${fmt(k, { month: 'short', day: 'numeric' })}, ${clock(t)}`;
  };
  const inLabel = ms => {
    const m = Math.max(1, Math.round(ms / 60000));
    return m < 60 ? `in ${m} min` : m < 1440 ? `in ${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}` : `in ${Math.round(m / 1440)} days`;
  };
  const ruleLabel = r => r.repeat === 'daily' ? 'Daily' : r.repeat === 'weekdays' ? 'Weekdays' : `Every ${fmt(r.date, { weekday: 'short' })}`;
  const describeRem = r => r.repeat ? `${ruleLabel(r)} ${clock(atTime(r.date, r.time))}` : whenLabel(atTime(r.date, r.time));
  function remNote(r) {
    const t = atTime(r.date, r.time), now = Date.now();
    if (!r.repeat && t <= now) return '⚠ That time has already passed — pick a later one.';
    const s = r.repeat ? `🔔 ${REPEAT_LABEL[r.repeat]} at ${clock(t)}, starting ${fmt(r.date, { month: 'short', day: 'numeric' })}.`
      : `🔔 You'll be reminded ${inLabel(t - now)} (${whenLabel(t)}).`;
    return notifState() === 'push' ? s : s + ' Turn on notifications in 🔔 Reminders to get it even when the app is closed.';
  }

  const taskDoneOn = (t, day) => t.repeat === 'daily' ? isDone(day, t.id) : !!finishedOn(t);
  const ruleMatches = (r, k) => r.repeat === 'daily' || (r.repeat === 'weekdays'
    ? ![0, 6].includes(parseKey(k).getDay()) : parseKey(k).getDay() === parseKey(r.date).getDay());
  // reminder times of one item in (from, to]; a task's reminders stop once it is done (for that day)
  function occurrences(item, isTask, from, to) {
    const r = item.rem, out = [];
    if (!r?.time || !r.date) return out;
    if (!r.repeat) { const t = atTime(r.date, r.time); if (t > from && t <= to) out.push({ t, day: r.date }); }
    else {
      const first = dayKey(new Date(from)), last = dayKey(new Date(Math.min(to, from + 400 * DAY)));
      for (let k = r.date > first ? r.date : first; k <= last; k = addDays(k, 1)) {
        if (!ruleMatches(r, k)) continue;
        const t = atTime(k, r.time);
        if (t > from && t <= to) out.push({ t, day: k });
      }
    }
    if (r.snooze > from && r.snooze <= to) out.push({ t: r.snooze, day: dayKey(new Date(r.snooze)), snooze: true });
    return (isTask ? out.filter(o => !taskDoneOn(item, o.day)) : out).sort((a, b) => a.t - b.t);
  }
  const nextOccurrence = (item, isTask, now = Date.now()) => occurrences(item, isTask, now, item.rem?.repeat ? now + 15 * DAY : Infinity)[0];
  function allOccurrences(from, to) {
    const list = [];
    for (const [items, isTask] of [[state.tasks, true], [state.assets, false]])
      for (const item of items) for (const o of occurrences(item, isTask, from, to)) list.push({ ...o, item, isTask, tag: `${item.id}@${o.snooze ? 's' : ''}${o.t}` });
    return list.sort((a, b) => a.t - b.t);
  }
  const findItem = id => {
    const t = state.tasks.find(x => x.id === id);
    if (t) return { item: t, isTask: true };
    const a = state.assets.find(x => x.id === id);
    return a ? { item: a, isTask: false } : null;
  };
  const doneDayFor = t => t.repeat === 'daily' || today >= t.date ? today : t.date;
  const notifBody = (item, isTask, t) => (item.desc || '').split('\n')[0].slice(0, 140)
    || `${isTask ? 'Task' : item.kind === 'asset' ? 'Asset' : 'Project'} · ${clock(t)}`;

  // ---- the ⏰ badge on cards ----
  function remBadgeInfo(item, isTask) {
    const r = item.rem;
    if (!r?.time) return null;
    const now = Date.now(), next = nextOccurrence(item, isTask, now);
    if (next) {
      const soon = next.t - now < 3600e3;
      const text = next.snooze ? `Snoozed · ${clock(next.t)}` : soon && !r.repeat ? inLabel(next.t - now) : r.repeat ? describeRem(r) : whenLabel(next.t);
      return { text: '⏰ ' + text, cls: soon ? ' soon' : '', title: `Reminder ${whenLabel(next.t)} — click to change` };
    }
    if (r.repeat || (isTask && taskDoneOn(item, r.date))) return null;
    return { text: '⏰ ' + whenLabel(atTime(r.date, r.time)), cls: ' late', title: 'This reminder has passed — click to change' };
  }
  function remBadge(item, isTask) {
    const i = remBadgeInfo(item, isTask);
    return i && h('span', { class: 'badge rem' + i.cls, 'data-rem': item.id, title: i.title, text: i.text,
      onclick: e => { e.stopPropagation(); editReminder(item.id); } });
  }
  function refreshBadges() {
    document.querySelectorAll('.badge.rem[data-rem]').forEach(el => {
      const f = findItem(el.dataset.rem), i = f && remBadgeInfo(f.item, f.isTask);
      if (!i) return el.remove();
      el.textContent = i.text; el.className = 'badge rem' + i.cls; el.title = i.title;
    });
    updateRemBtn();
  }
  function updateRemBtn() {
    const now = Date.now(), n = allOccurrences(now, atTime(addDays(today, 1), '00:00')).length;
    $('#remBtn').replaceChildren('🔔 Reminders', n ? h('em', { text: n, title: `${n} more today` }) : '');
  }

  function editReminder(id) {
    const f = findItem(id);
    if (!f) return;
    if (f.isTask && !tasksFor(sel).some(t => t.id === id)) setSel(tasksFor(today).some(t => t.id === id) ? today : f.item.date);
    filter = 'all'; editingId = id; editRem = true; render();
    requestAnimationFrame(() => document.querySelector(`.task[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' }));
  }
  function focusItem(id) {
    const f = findItem(id);
    if (!f) return;
    if (f.isTask && !tasksFor(sel).some(t => t.id === id)) setSel(tasksFor(today).some(t => t.id === id) ? today : f.item.date);
    if (filter !== 'all') { filter = 'all'; render(); }
    requestAnimationFrame(() => {
      const el = document.querySelector(`.task[data-id="${CSS.escape(id)}"]`);
      if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    });
  }
  function snooze(item, minutes) {
    const at = Date.now() + minutes * 60_000, d = new Date(at);
    item.rem = item.rem?.time ? { ...item.rem, snooze: at } : { date: dayKey(d), time: `${pad(d.getHours())}:${pad(d.getMinutes())}`, repeat: '' };
    item.u = Date.now();
    dropAlerts(item.id);
    save(); render();
    toast(`⏰ Snoozed until ${clock(at)}`);
  }

  // ---- in-app alerts (+ sound, vibration and a system notification) ----
  let alerts = [];
  let lastCheck = Number((() => { try { return localStorage.getItem('rem-last-check'); } catch {} })()) || Date.now();
  function checkReminders() {
    const now = Date.now(), from = Math.max(lastCheck, now - 6 * 3600e3);   // reminders missed while closed: up to 6 h back
    if (now <= from) return;
    lastCheck = now;
    try { localStorage.setItem('rem-last-check', String(now)); } catch {}
    const due = allOccurrences(from, now);
    due.forEach(o => fire(o, now - o.t > 120_000));
    if (due.length) refreshBadges();
  }
  function fire(o, missed) {
    if (alerts.some(a => a.tag === o.tag)) return;
    alerts = alerts.filter(a => a.id !== o.item.id);          // a newer reminder of the same item replaces the older one
    alerts.push({ tag: o.tag, id: o.item.id, t: o.t, day: o.day, missed });
    renderAlerts();
    if (missed) return;
    chime();
    try { navigator.vibrate?.([200, 100, 200]); } catch {}
    systemNotify(o.item, o.isTask, o.tag, o.t);
  }
  const dropAlerts = id => { alerts = alerts.filter(a => a.id !== id); renderAlerts(); };
  function renderAlerts() {
    alerts = alerts.filter(a => findItem(a.id));

    const ed = e.target.closest?.('.editor') || mainEditor;
    e.preventDefault();
    ed._addFiles(files);
    if (ed === mainEditor && !e.target.closest?.('.editor')) ed._focus();
  });

  // stop the browser from navigating away if an image is dropped outside an editor
  ['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => { if (e.dataTransfer?.types?.includes('Files') && !e.target.closest?.('.editor')) e.preventDefault(); }));

  $('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('on'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lightbox').classList.remove('on'); });

  $('#uncheck').addEventListener('click', () => {
    const k = sel, ids = Object.keys(doneFor(k)).filter(id => isDone(k, id));
    if (!ids.length) return;
    const now = Date.now();
    ids.forEach(id => { state.done[k][id] = -now; }); save(); render();
    toast('Day reset', () => { const t = Date.now(); ids.forEach(id => { state.done[k][id] = t; }); save(); render(); });
  });

  $('#remBtn').addEventListener('click', openRemDialog);
  $('#remDlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  $('#syncBtn').addEventListener('click', () => { syncDialog(); $('#syncDlg').showModal(); });
  $('#syncDlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
  const syncNow = () => { if (!document.hidden) sync(); };
  document.addEventListener('visibilitychange', syncNow);
  window.addEventListener('focus', syncNow);
  window.addEventListener('online', syncNow);
  setInterval(syncNow, 60000);

  $('#export').addEventListener('click', () => {
    const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(state)], { type: 'application/json' })), download: `checklist-${dayKey()}.json` });
    a.click(); URL.revokeObjectURL(a.href);
  });
  $('#import').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.tasks)) throw 0;
      if (!confirm('Replace your current checklist with this backup?')) return;
      state = normalize(data);
      save(); render(); toast('Backup imported');
    } catch { toast('That file is not a valid backup'); }
  });

  // midnight rollover while the page is open
  const checkDay = () => {
    const k = dayKey();
    if (k !== today) { const wasToday = sel === today; today = k; if (wasToday) { sel = k; viewMonth = k.slice(0, 7); } mainEditor?._setDate(sel); render(); }
  };
  setInterval(checkDay, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });

  (async () => {
    await load();
    if (syncKey) idb.set(syncKey, 'syncKey').catch(() => {});
    showSync();
    sync();
    mainEditor = createEditor({ date: sel, onSave: addTask, draftKey: 'daily-checklist-draft' });
    $('#composer').append(mainEditor);
    render();
    handleLink();
    window.addEventListener('hashchange', () => handleLink());
    startReminders();
  })();
})();
</script>
</body>
</html>
